name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not upload a real document that contains or once contained personal information. Recreate the smallest synthetic equivalent."
  - type: input
    id: version
    attributes:
      label: FillOnce version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options: [CLI, Local review UI, Python API, Generated PDF, Audit report]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command and a minimal synthetic input if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python version, and PDF viewer
