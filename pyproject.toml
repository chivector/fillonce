[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fillonce"
version = "0.1.0"
description = "Local-first PDF form filling with evidence for every answer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chi Zhang" }]
keywords = ["pdf", "acroform", "forms", "privacy", "automation", "provenance", "document-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "rich>=13.8,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
demo = ["reportlab>=4.2,<5"]
web = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "reportlab>=4.2,<5",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
fillonce = "fillonce.cli:app"

[project.urls]
Homepage = "https://github.com/chivector/fillonce"
Source = "https://github.com/chivector/fillonce"
Issues = "https://github.com/chivector/fillonce/issues"
Documentation = "https://github.com/chivector/fillonce#readme"
Changelog = "https://github.com/chivector/fillonce/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fillonce"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/fillonce/web.py" = ["B008"]
